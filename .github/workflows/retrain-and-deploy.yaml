---
name: Retrain and Deploy (Staging)

on:
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        description: "Force retrain/deploy even if drift is below threshold"
        default: false
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: retrain-deploy-staging
  cancel-in-progress: false

jobs:
  drift_check:
    runs-on: ubuntu-latest
    outputs:
      retrain: ${{ steps.chk.outputs.retrain }}
      drift_value: ${{ steps.chk.outputs.drift_value }}

    steps:
      - name: Check drift in Prometheus
        id: chk
        env:
          PROM_URL: ${{ secrets.PROM_URL }}
          DRIFT_THRESHOLD: "1.5"
        run: |
          set -euo pipefail
          QUERY='max(max_over_time(model_drift_score{namespace="model-staging",service="model-active"}[15m])) or on() vector(0)'
          JSON="$(curl -fsS -G "${PROM_URL}/api/v1/query" --data-urlencode "query=${QUERY}")"
          VAL="$(echo "${JSON}" | jq -r '.data.result[0].value[1] // "0"')"
          echo "drift_value=${VAL}" >> "${GITHUB_OUTPUT}"
          if awk "BEGIN {exit !(${VAL} > ${DRIFT_THRESHOLD})}"; then
            echo "retrain=true" >> "${GITHUB_OUTPUT}"
          else
            echo "retrain=false" >> "${GITHUB_OUTPUT}"
          fi

  retrain_build_deploy:
    needs: drift_check
    if: (github.event_name == 'workflow_dispatch' && inputs.force == true) || (needs.drift_check.outputs.retrain == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set tag
        run: echo "TAG=sha-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: docker.io/joevisco/house-pricemodel:${{ env.TAG }}
          load: true
          push: false

      - name: Train inside image
        env:
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/work" -w /work docker.io/joevisco/house-pricemodel:${TAG} python src/data/run_processing.py
          docker run --rm -v "${{ github.workspace }}:/work" -w /work docker.io/joevisco/house-pricemodel:${TAG} python src/models/train_model.py --config configs/model_config.yaml --data data/processed/cleaned_house_data.csv --models-dir models

      - name: Generate baseline_stats.json
        env:
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/work" -w /work docker.io/joevisco/house-pricemodel:${TAG} python - <<'PY'
          import json, numpy as np
          from pathlib import Path

          X_PATH = Path("models/trained/X_train.npy")
          OUT_PATH = Path("models/trained/baseline_stats.json")

          X = np.load(X_PATH)
          X = np.asarray(X, dtype=float)

          mu = X.mean(axis=0)
          std = X.std(axis=0)
          std = np.where(std == 0, 1e-9, std)

          features = [str(i) for i in range(X.shape[1])]
          baseline = {
              str(i): {"mean": float(mu[i]), "std": float(std[i])}
              for i in range(X.shape[1])
          }

          OUT_PATH.write_text(
              json.dumps({"features": features, "baseline": baseline}),
              encoding="utf-8",
          )

          print("baseline written")
          PY

      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -f models/trained/house_price_model.pkl
          test -f models/trained/preprocessor.pkl
          test -f models/trained/baseline_stats.json
          test -f models/trained/model_bundle.pkl

      - name: Rebuild image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: docker.io/joevisco/house-pricemodel:${{ env.TAG }}
          load: true
          push: false

      - name: Push image
        run: docker push docker.io/joevisco/house-pricemodel:${{ env.TAG }}

      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -fsSL -o kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Update staging image tag
        run: |
          set -euo pipefail
          cd deployment/gitops/overlays/staging
          kustomize edit set image docker.io/joevisco/house-pricemodel=docker.io/joevisco/house-pricemodel:${{ env.TAG }}

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add deployment/gitops/overlays/staging
          git commit -m "auto: retrain deploy ${TAG}" || echo "No changes"
          git push origin main
