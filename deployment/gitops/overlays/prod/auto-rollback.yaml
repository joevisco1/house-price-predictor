apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-auto-rollback
  labels:
    app: model
    env: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-auto-rollback
  labels:
    app: model
    env: prod
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-auto-rollback
  labels:
    app: model
    env: prod
subjects:
  - kind: ServiceAccount
    name: rollout-auto-rollback
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollout-auto-rollback
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-auto-rollback
  labels:
    app: model
    env: prod
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: model
            env: prod
        spec:
          serviceAccountName: rollout-auto-rollback
          restartPolicy: Never
          containers:
            - name: rollback
              # Use the Argo Rollouts kubectl plugin image so we can "undo" reliably
              image: argoproj/kubectl-argo-rollouts:latest
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -lc
                - |
                  set -euo pipefail
                  NS="model-prod"
                  ROLLOUT="model"

                  # Identify the rollout's current pod template hash (revision under evaluation)
                  HASH="$(kubectl -n "$NS" get rollout "$ROLLOUT" -o jsonpath='{.status.currentPodHash}' || true)"

                  # newest *post* AnalysisRun for THIS rollout + THIS hash
                  POST_LINE="$(kubectl -n "$NS" get analysisrun \
                    -l app=model,rollout-type=PostPromotion,rollouts-pod-template-hash="$HASH" \
                    --sort-by=.metadata.creationTimestamp \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.status.phase}{"\n"}{end}' \
                    | tail -n 1 || true)"

                  [ -z "${POST_LINE:-}" ] && exit 0

                  POST_NAME="$(echo "$POST_LINE" | cut -d'|' -f1)"
                  POST_PHASE="$(echo "$POST_LINE" | cut -d'|' -f2)"

                  [ "$POST_PHASE" != "Failed" ] && exit 0

                  echo "Detected failed post analysis ($POST_NAME) for hash=$HASH. Undoing rollout/$ROLLOUT"

                  # Roll back to previous ReplicaSet / revision
                  kubectl-argo-rollouts undo "$ROLLOUT" -n "$NS"

                  # Pause progression after rollback
                  kubectl -n "$NS" patch rollout "$ROLLOUT" --type merge \
                    -p '{"spec":{"paused":true}}' || true
