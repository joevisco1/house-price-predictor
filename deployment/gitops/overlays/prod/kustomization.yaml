apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../../base/model

commonLabels:
  env: prod

namespace: model-prod

configMapGenerator:
  - name: env-vars
    behavior: replace
    literals:
      - NAMESPACE=model-prod

replacements:
  - source:
      kind: ConfigMap
      name: env-vars
      fieldPath: data.NAMESPACE
    targets:
      - select:
          kind: AnalysisTemplate
          name: model-gate-latency-errors
        fieldPaths:
          - spec.args.[name=namespace].value

patches:
  - path: patch-rollout-podlabels.yaml
  - path: patch-servicemonitor-namespace.yaml
  - path: patch-service-active-env.yaml
  - path: patch-service-preview-env.yaml
  - path: patch-rollout-restart.yaml

images:
  - name: docker.io/joevisco/house-pricemodel
    newTag: sha-ae04857
