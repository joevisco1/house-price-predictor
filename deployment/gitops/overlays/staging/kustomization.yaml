apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../../base/model
commonLabels:
  env: staging
namespace: model-staging
configMapGenerator:
  - name: env-vars
    behavior: replace
    literals:
      - NAMESPACE=model-staging

replacements:
  - source:
      kind: ConfigMap
      name: env-vars
      fieldPath: data.NAMESPACE
    targets:
      - select:
          kind: AnalysisTemplate
          name: model-gate-latency-errors
        fieldPaths:
          - spec.args.[name=namespace].value
patches:
  - path: patch-rollout-podlabels.yaml
  - path: patch-servicemonitor-namespace.yaml
  - path: patch-service-active-env.yaml
  - path: patch-service-preview-env.yaml
  - path: patch-rollout-restart.yaml
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: fastapi-latency-autoscaler
    path: patch-scaledobject-staging.yaml
images:
  - name: docker.io/joevisco/house-pricemodel
    newTag: sha-ae04857
