apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/streamlit
- namespace.yaml
- ../../base/model
commonLabels:
  env: staging
namespace: model-staging
configMapGenerator:
- behavior: replace
  literals:
  - NAMESPACE=model-staging
  name: env-vars
patches:
- path: patch-rollout-env-selector.yaml
  target:
    group: argoproj.io
    kind: Rollout
    name: model
    version: v1alpha1
- path: patch-rollout-podlabels.yaml
- path: patch-servicemonitor-namespace.yaml
- path: patch-servicemonitor-port.yaml
- path: patch-service-active-env.yaml
- path: patch-service-preview-env.yaml
- path: patch-rollout-analysis-namespace.yaml
  target:
    group: argoproj.io
    kind: Rollout
    name: model
    version: v1alpha1
images:
- name: docker.io/joevisco/house-pricemodel
  newName: docker.io/joevisco/house-pricemodel
  newTag: sha-79c57c1-37
- name: docker.io/joevisco/streamlit
  newTag: 1c4f93c
