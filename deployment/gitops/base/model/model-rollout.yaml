apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: model
  labels:
    app: models

spec:
  revisionHistoryLimit: 3
  replicas: 2

  selector:
    matchLabels:
      app: model

  template:
    metadata:
      labels:
        app: model

    spec:
      containers:
        - name: house-pricemodel
          image: docker.io/joevisco/house-pricemodel:1c4f93c
          imagePullPolicy: Always

          env:
            - name: DRIFT_THRESHOLD
              value: "0.2"
            - name: SERVICE_NAME
              value: "model"

          ports:
            - containerPort: 8000
              protocol: TCP

          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 512Mi

  strategy:
    blueGreen:
      activeService: model-active
      previewService: model-preview
      autoPromotionEnabled: false
      abortScaleDownDelaySeconds: 60

      prePromotionAnalysis:
        templates:
          - templateName: model-gate-latency-errors
        args:
          - name: namespace
            value: PLACEHOLDER_NAMESPACE
          - name: service
            value: model-preview
          - name: job
            value: model-preview

      postPromotionAnalysis:
        templates:
          - templateName: model-slo-post
        args:
          - name: namespace
            value: PLACEHOLDER_NAMESPACE
          - name: service
            value: model-active
          - name: job
            value: model-active
