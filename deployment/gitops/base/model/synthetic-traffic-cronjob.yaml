apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-synthetic-traffic
  labels:
    app: model
spec:
  schedule: "*/1 * * * *"   # every minute
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: model
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.6.0
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -lc
                - |
                  set -e
                  # Hit both active + preview with synth headers (NO /predict to avoid 5xx)
                  for svc in model-active model-preview; do
                    curl -sS -m 2 "http://${svc}:8000/drift" \
                      -H "X-Synth: 1" \
                      -H "X-Synth-Kind: drift" \
                      >/dev/null || true
                  done
