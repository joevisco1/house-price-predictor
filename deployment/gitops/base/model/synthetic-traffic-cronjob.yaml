apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-synthetic-traffic
  labels:
    app: model
spec:
  schedule: "*/1 * * * *"   # every minute
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: model
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.6.0
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -lc
                - |
                  set -e
                  # Hit both active + preview with VALID schema + synth headers
                  for svc in model-active model-preview; do
                    curl -sS -m 2 -X POST "http://${svc}:8000/predict" \
                      -H "Content-Type: application/json" \
                      -H "X-Synth: 1" \
                      -H "X-Synth-Kind: normal" \
                      -d '{"sqft":1200,"bedrooms":3,"bathrooms":2,"location":"suburban","year_built":2005,"condition":"Good"}' \
                      >/dev/null || true
                  done
