apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fastapi-latency-autoscaler
spec:
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        metricName: fast_api_latency_p95_predict
        # ✅ stop using ".default" DNS — use monitoring namespace service DNS
        serverAddress: http://prom-kube-prometheus-stack-prometheus.monitoring.svc:9090
        threshold: "0.12"
        # ✅ remove namespace="default" coupling; overlays will pin real namespace
        query: >
          (
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{
                  job="model-active",
                  handler="/predict"
                }[5m])
              )
            )
          )
          and on()
          (
            sum(rate(http_request_duration_seconds_count{
              job="model-active",
              handler="/predict"
            }[5m])) > 0
          )
          or on() vector(0)
    - type: cpu
      metricType: Utilization
      metadata:
        value: "50"
