apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: model-post-slo-latency-errors
spec:
  args:
    - name: namespace
    - name: service

  metrics:
    - name: p95-latency
      interval: 30s
      count: 10
      # guard empty vector
      successCondition: len(result) > 0 && result[0] < 0.25
      failureLimit: 2
      provider:
        prometheus:
          address: http://prom-kube-prometheus-stack-prometheus.default:9090
          query: |
            histogram_quantile(
              0.95,
              sum(rate(http_request_duration_seconds_bucket{
                namespace="{{args.namespace}}",
                service="{{args.service}}"
              }[2m])) by (le)
            )

    - name: error-rate-5xx
      interval: 30s
      count: 10
      successCondition: len(result) > 0 && result[0] < 0.05
      failureLimit: 2
      provider:
        prometheus:
          address: http://prom-kube-prometheus-stack-prometheus.default:9090
          query: |
            (
              sum(rate(http_requests_total{
                namespace="{{args.namespace}}",
                service="{{args.service}}",
                status=~"5.."
              }[2m]))
            )
            /
            clamp_min(
              sum(rate(http_requests_total{
                namespace="{{args.namespace}}",
                service="{{args.service}}"
              }[2m])),
              0.001
            )

    - name: min-rps-floor
      interval: 30s
      count: 10
      successCondition: len(result) > 0 && result[0] > 0.2
      failureLimit: 2
      provider:
        prometheus:
          address: http://prom-kube-prometheus-stack-prometheus.default:9090
          query: |
            sum(rate(http_requests_total{
              namespace="{{args.namespace}}",
              service="{{args.service}}"
            }[2m]))
