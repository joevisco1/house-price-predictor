apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: model-slo-post
spec:
  metrics:
    - name: p95-latency
      interval: 30s
      count: 4
      provider:
        prometheus:
          address: http://prom-kube-prometheus-stack-prometheus.default.svc:9090
          query: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_highr_seconds_bucket{
                  namespace="{{args.namespace}}",
                  service=~"model-active|model-preview"
                }[2m])
              )
            ) or on() vector(0)
      # ✅ stays the same (now safe because query never returns NaN/empty)
      successCondition: len(result) > 0 && result[0] < 0.25

    - name: min-rps-floor
      interval: 30s
      count: 4
      provider:
        prometheus:
          address: http://prom-kube-prometheus-stack-prometheus.default.svc:9090
          query: |
            sum(
              rate(http_request_duration_highr_seconds_count{
                namespace="{{args.namespace}}",
                service=~"model-active|model-preview"
              }[2m])
            ) or on() vector(0)
      # ✅ zero traffic passes; traffic must be > 0.02 rps if present
      successCondition: len(result) > 0 && (result[0] == 0 || result[0] > 0.02)
