apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: house-price
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:joevisco1/house-price-predictor.git
    targetRevision: main
    path: deployment/kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
